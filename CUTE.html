<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 30px 15px;
        background: linear-gradient(
            135deg,
            #d9efff,
            #b6d8f0,
            #8fb8dc,
            #d1e8fa
        );
        color: #244766;
        font-family: 'Cormorant Garamond', serif;
    }

    .container {
        max-width: 850px;
        margin: auto;
        padding: 35px;
        background: rgba(230, 243, 255, 0.94);
        border: 2px solid #91b9dc;
        outline: 1px solid #c4e1f7;
        outline-offset: 6px;
        box-shadow: 0 8px 25px #315d8544;
    }

    .ocean {
        text-align: center;
        color: #548bb8;
        font-size: 15px;
        letter-spacing: 6px;
        margin-bottom: 10px;
    }

    h1 {
        font-family: 'Great Vibes', cursive;
        font-weight: normal;
        font-size: 58px;
        text-align: center;
        color: #5485b5;
        margin: 10px 0 25px;
    }

    h2 {
        font-family: 'Great Vibes', cursive;
        font-size: 36px;
        font-weight: normal;
        color: #477da9;
        text-align: center;
        margin-bottom: 10px;
    }

    p {
        font-size: 20px;
        line-height: 1.65;
        letter-spacing: 1px;
        text-align: center;
    }

    .divider {
        border: none;
        border-top: 1px solid #a4c9e8;
        margin: 30px 0;
    }

    .quote {
        color: #527da5;
        font-style: italic;
        font-size: 19px;
    }

    .interests {
        text-align: center;
        line-height: 2;
        font-size: 19px;
        color: #315b7e;
    }

    .dream {
        background: #d3e9fc;
        border: 1px dashed #83add2;
        padding: 20px;
        margin-top: 20px;
    }

    strong {
        color: #285783;
    }

    footer {
        text-align: center;
        margin-top: 30px;
        color: #507da7;
        font-size: 15px;
        letter-spacing: 3px;
    }

    @media (max-width: 600px) {
        .container {
            padding: 22px;
        }

        h1 {
            font-size: 45px;
        }

        p {
            font-size: 18px;
        }
    }
</style>
